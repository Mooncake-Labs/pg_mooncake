[target.'cfg(target_os="macos")']
rustflags = ["-Clink-arg=-Wl,-undefined,dynamic_lookup"]

# There is no committed Cargo.lock, so dependencies resolve fresh: prefer versions that support the
# package rust-version (rust-toolchain.toml) over newer ones that need a newer compiler.
[resolver]
incompatible-rust-versions = "fallback"
